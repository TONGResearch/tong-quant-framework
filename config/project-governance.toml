[baseline]
framework_version = "0.8.0"
database_schema_version = "0.8.2"
migration_head = "0010_portfolio_evidence_lineage"
current_phase = "parallel-evidence-and-controlled-launch"
canonical_status_document = "PROJECT_STATUS.md"

[freeze]
live_trading_frozen = true
paper_trading_allowed = true
broker_sandbox_allowed = true
required_execution_mode = "disabled"
allow_live_orders = false
required_notification_mode = "disabled"
reason = "Paper and sandbox development may proceed while live trading remains frozen"
forbidden_capabilities = [
  "live_broker_order_submission",
  "live_order_generation",
  "unattended_live_trading",
  "live_trade_and_fill_models",
  "live_trading",
  "asset_allocation",
  "auto_rebalancing",
]

[readiness]
production = "not_ready"
research = "conditional"
validation = "mechanically_ready_evidence_blocked"
portfolio = "research_artifact_only"
pit = "unsuitable"

[quality]
required_commands = [
  ".venv/bin/pytest",
  ".venv/bin/ruff check .",
  ".venv/bin/mypy src scripts",
  "git diff --check",
  ".venv/bin/python scripts/check_project_governance.py",
]
required_documents = [
  "AGENTS.md",
  "PROJECT_STATUS.md",
  "docs/architecture.md",
  "docs/current-state-report.md",
  "docs/data-trust-matrix.md",
  "docs/database-migrations.md",
  "docs/engineering-continuity.md",
  "docs/provider-monitor-operations.md",
  "docs/provider-evidence-bundles.md",
  "docs/backtesting-data-assurance.md",
  "docs/technical-research-extension.md",
  "docs/execution-readiness-storyboard.md",
  "docs/risk-register.md",
  "docs/technical-debt-register.md",
  "docs/yahoo-daily-bar-calibration.md",
  "docs/accelerated-controlled-launch.md",
  "docs/architecture-audit-2026-10-15.md",
  "docs/sse-main-board-pilot.md",
  "docs/operational-data-sample-2026-10-16.md",
]

[next_phase]
objective = "Accumulate evidence while hardening lineage and market rules for controlled paper trading"
promotion_requirement = "Paper trading requires authoritative lineage, deterministic simulation, reconciliation, and fail-closed risk controls; live trading remains separately gated"

