name: Provider contract monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1,4"

permissions:
  contents: read

env:
  PROVIDER_ARTIFACT_RETENTION_DAYS: "90"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Restore provider contract history
        uses: actions/cache/restore@v4
        with:
          path: data/provider-contract-monitor.sqlite3
          key: provider-contract-monitor-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            provider-contract-monitor-${{ github.repository_id }}-

      - name: Probe provider contracts
        id: provider-probe
        continue-on-error: true
        run: |
          timeout 300 python scripts/run_provider_contract_monitor.py \
            --database data/provider-contract-monitor.sqlite3 \
            --output-dir provider-contract-artifacts \
            --artifact-retention-days "$PROVIDER_ARTIFACT_RETENTION_DAYS" \
            --owner TONGResearch \
            --fail-on-defect

      - name: Build longitudinal baseline
        if: always()
        run: |
          python scripts/build_provider_contract_baseline.py \
            --database data/provider-contract-monitor.sqlite3 \
            --output-dir provider-contract-artifacts

      - name: Export credential-free operational evidence
        if: always()
        shell: bash
        run: |
          as_of="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          python scripts/export_provider_evidence.py \
            --database data/provider-contract-monitor.sqlite3 \
            --as-of "$as_of" \
            --output-dir provider-contract-artifacts

      - name: Save provider contract history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/provider-contract-monitor.sqlite3
          key: provider-contract-monitor-${{ github.repository_id }}-${{ github.run_id }}

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-contract-ops-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            provider-contract-artifacts/
            data/provider-contract-monitor.sqlite3
          if-no-files-found: warn
          retention-days: ${{ fromJSON(env.PROVIDER_ARTIFACT_RETENTION_DAYS) }}

      - name: Publish provider health summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(provider-contract-artifacts/provider-health-*.md)
          if (( ${#reports[@]} == 0 )); then
            echo "Provider health report was not generated." >> "$GITHUB_STEP_SUMMARY"
          else
            cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail closed on implementation defects
        if: steps.provider-probe.outcome == 'failure'
        run: exit 1
