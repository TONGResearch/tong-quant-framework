name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src scripts

      - name: Verify project governance
        run: python scripts/check_project_governance.py

      - name: Build research package
        run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/tong-quant-wheel" .

      - name: Install research package in isolated target
        run: >-
          python -m pip install --no-deps --target "${RUNNER_TEMP}/tong-quant-installed"
          "${RUNNER_TEMP}/tong-quant-wheel/"*.whl

      - name: Smoke test installed research package outside checkout
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/tong-quant-installed
        run: |
          python -c 'import os,pathlib,tong_quant; from importlib.metadata import version; assert pathlib.Path(tong_quant.__file__).is_relative_to(pathlib.Path(os.environ["PYTHONPATH"])); assert version("tong-quant-framework") == tong_quant.__version__'
          "${RUNNER_TEMP}/tong-quant-installed/bin/tong-quant" status --project-root "${GITHUB_WORKSPACE}"
